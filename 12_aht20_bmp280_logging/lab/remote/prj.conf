CONFIG_MBOX=y
CONFIG_I2C=y
# No CONFIG_SENSOR / CONFIG_AHT20 / CONFIG_BMP280 here -- this lab talks to
# both sensors directly with raw i2c_write()/i2c_write_read() calls (see
# main.c), not the Zephyr sensor subsystem. This is a deliberate choice,
# not a stopgap: it's what makes the boot-time address auto-scan possible
# (the sensor subsystem needs a fixed devicetree address per node), and it
# sidesteps having to guess this Zephyr version's exact driver Kconfig
# symbol names (a recurring problem in earlier labs -- see Lab 11's raw-SPI
# rationale for the same tradeoff on the display side).
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
