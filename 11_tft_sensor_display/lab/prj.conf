CONFIG_MBOX=y
CONFIG_SPI=y
CONFIG_GPIO=y
# No CONFIG_DISPLAY / CONFIG_CHARACTER_FRAMEBUFFER / CONFIG_ST7789V here --
# this lab talks to the panel directly with raw spi_write_dt() calls (see
# src/main.c and the "zds,st7789v" custom binding), not Zephyr's in-tree
# Display/CFB subsystem. This also sidesteps the in-tree st7789v driver's
# devicetree "mipi-mode" property requirement entirely.

# st7789_fill_rect() keeps a one-row (240px * 2 bytes/px = 480 byte) stack
# buffer rather than a full-screen framebuffer; bump the main stack a bit
# to keep headroom alongside that plus the smaller per-character buffer in
# st7789_draw_char() and this lab's own mbox worker thread.
CONFIG_MAIN_STACK_SIZE=4096

# ns16550_uart1 (M55's only UART / console) is disabled in the devicetree
# overlay because its pins are reused for SPI0. The board defconfig's
# default UART_CONSOLE=y then fails its SERIAL_HAS_DRIVER dependency and
# aborts the Kconfig step, so it must be turned off explicitly here.
# (Explicitly setting CONFIG_SERIAL=n is NOT the fix -- this SoC's Kconfig
# unconditionally y-selects SERIAL_SUPPORT_ASYNC from SOC_SR100_M55,
# which then conflicts with SERIAL=n and aborts the build a different way.
# Leave CONFIG_SERIAL at its default; only the console symbols need
# turning off.)
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
