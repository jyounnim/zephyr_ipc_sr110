CONFIG_MBOX=y
CONFIG_I2C=y
# No CONFIG_SENSOR / CONFIG_AHT20 here -- same raw-I2C rationale as Lab
# 12/13 (boot-time probe, no Kconfig driver symbol guessing).

# Operator command intake on the console UART (ns16550_uart0), read via
# uart_poll_in() from a dedicated thread (Uart_Cmd_Task in main.c) -- same
# polling design proven in Lab 13/14. This UART instance's driver returned
# -ENOTSUP for uart_irq_callback_set() on real hardware (see Lab 13's
# troubleshooting doc), so interrupt-driven RX is not used. Polling needs
# no extra UART Kconfig beyond the CONFIG_SERIAL already on by default for
# the console.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=2048
