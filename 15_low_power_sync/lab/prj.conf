CONFIG_MBOX=y
CONFIG_SPI=y
CONFIG_GPIO=y
# No CONFIG_DISPLAY / CONFIG_CHARACTER_FRAMEBUFFER / CONFIG_ST7789V -- same
# raw-SPI approach as Lab 11/12/13/14 (see Lab 11's prj.conf comment).
CONFIG_MAIN_STACK_SIZE=4096
# ns16550_uart1 (M55's only UART/console) is disabled in the devicetree
# overlay because SPI0 reuses its pins -- see Lab 11's prj.conf comment
# for why CONFIG_UART_CONSOLE=n/CONFIG_CONSOLE=n (and NOT CONFIG_SERIAL=n)
# is the correct fix. M55 never sends console commands in this lab -- all
# commands are M4-local (see remote/src/main.c).
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# NOTE on power management: this lab deliberately does NOT set CONFIG_PM.
# See src/main.c's file header comment -- Sync_Task blocks on K_FOREVER
# with nothing else runnable, which already puts the CPU into Zephyr's
# default WFI-based idle wait with zero extra configuration. Explicit
# deeper SoC power states were not confirmed available/working on this
# board for M55 in this curriculum, so CONFIG_PM is left off rather than
# guessed at.
