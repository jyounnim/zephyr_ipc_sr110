CONFIG_MBOX=y

# NO CONFIG_I2C here -- this lab does not touch the AHT20/BMP280 sensors
# from Lab 12/13 at all (see remote/src/main.c header comment).

# Operator command intake on the console UART (ns16550_uart0), read via
# uart_poll_in() from a dedicated thread (Uart_Cmd_Task in main.c) --
# same polling design proven on real hardware in Lab 13, carried forward
# unchanged. This UART instance's driver returned -ENOTSUP for
# uart_irq_callback_set() on real hardware (see Lab 13's troubleshooting
# doc), so interrupt-driven RX is not used. Polling needs no extra UART
# Kconfig beyond the CONFIG_SERIAL that's already on by default for the
# console.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=2048
