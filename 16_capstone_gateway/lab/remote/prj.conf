CONFIG_MBOX=y
CONFIG_I2C=y
# No CONFIG_SENSOR-based driver for AHT20/BMP280 -- raw i2c_* calls, same
# rationale as Lab 12/13/15 (boot-time address auto-scan, no Kconfig driver
# symbol guessing).

CONFIG_SENSOR=y
# Confirmed correct during Lab 09 hardware testing -- the onboard
# accelerometer (Motion_Task) DOES use the Zephyr sensor subsystem, since
# it lives at a fixed devicetree node/address (unlike AHT20/BMP280).
CONFIG_MC3419=y

# Operator command intake on the console UART (ns16550_uart0), read via
# uart_poll_in() from Uart_Cmd_Task -- same polling design proven in
# Lab 13/14/15 (this UART instance's driver returns -ENOTSUP for
# uart_irq_callback_set() on real hardware). Needs no extra UART Kconfig
# beyond the CONFIG_SERIAL already on by default for the console.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=2048
