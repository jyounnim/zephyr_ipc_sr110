CONFIG_MBOX=y
CONFIG_I2C=y
# No CONFIG_SENSOR / CONFIG_AHT20 / CONFIG_BMP280 here -- same raw-I2C
# rationale as Lab 12 (boot-time address auto-scan, no Kconfig driver
# symbol guessing). See Lab 12's prj.conf comment.

# NEW in this lab: operator command intake on the console UART
# (ns16550_uart0), read via uart_poll_in() from a dedicated thread
# (Uart_Cmd_Task in main.c). An earlier version of this lab tried
# CONFIG_UART_INTERRUPT_DRIVEN=y + uart_irq_callback_set() instead, but
# on real hardware this UART instance's driver returned -ENOTSUP for
# uart_irq_callback_set() -- interrupt-driven RX simply isn't implemented
# for this UART, regardless of this Kconfig symbol. Polling needs no
# extra UART Kconfig beyond the CONFIG_SERIAL that's already on by
# default for the console.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=2048
